<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVisa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="shadowV" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgVisa)" />
  <!-- US 2x2 & Canada 50x70 Comparison Layout -->
  <g transform="translate(70, 60)" filter="url(#shadowV)">
    <rect width="210" height="260" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
    <rect x="25" y="20" width="160" height="160" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
    <circle cx="105" cy="85" r="38" fill="#E0E7FF" stroke="#4338CA" stroke-width="2" />
    <path d="M 60 170 C 60 125, 150 125, 150 170 Z" fill="#A5B4FC" />
    <line x1="15" y1="50" x2="195" y2="50" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="15" y1="125" x2="195" y2="125" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="105" y="205" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">USA VISA & DS-160</text>
    <text x="105" y="222" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">2 x 2 inch (51x51 mm)</text>
    <text x="105" y="240" font-family="system-ui, sans-serif" font-size="9" fill="#4B5563" text-anchor="middle">Strictly No Glasses • White BG</text>
  </g>

  <g transform="translate(320, 50)" filter="url(#shadowV)">
    <rect width="210" height="280" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
    <rect x="30" y="20" width="150" height="210" rx="4" fill="#F8FAFC" stroke="#059669" stroke-width="2" />
    <circle cx="105" cy="95" r="36" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" />
    <path d="M 60 215 C 60 160, 150 160, 150 215 Z" fill="#5EEAD4" />
    <text x="105" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">SCHENGEN & UK</text>
    <text x="105" y="265" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">35 x 45 mm Light Grey BG</text>
  </g>
</svg>

