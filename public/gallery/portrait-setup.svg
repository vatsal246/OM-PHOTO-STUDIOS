<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="rimLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgPort)" />
  <circle cx="300" cy="180" r="160" fill="url(#rimLight)" />
  <!-- Studio Portrait Icon Representation -->
  <g transform="translate(200, 70)">
    <circle cx="100" cy="90" r="45" fill="#F8FAFC" stroke="#F59E0B" stroke-width="3" />
    <path d="M 40 230 C 40 160, 160 160, 160 230 Z" fill="#E2E8F0" />
    <polygon points="100,165 92,185 108,185" fill="#DC2626" />
    <path d="M 90 185 L 100 230 L 110 185 Z" fill="#DC2626" />
  </g>
  <!-- Camera Aperture and Focus Bracket Graphic -->
  <g stroke="#FBBF24" stroke-width="2" fill="none">
    <path d="M 120 70 L 80 70 L 80 110" />
    <path d="M 480 70 L 520 70 L 520 110" />
    <path d="M 120 330 L 80 330 L 80 290" />
    <path d="M 480 330 L 520 330 L 520 290" />
  </g>
  <text x="300" y="340" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">STUDIO PORTRAIT & HEADSHOTS</text>
  <text x="300" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Professional Lighting • LinkedIn, Matrimonial & Corporate Profiles</text>
</svg>

