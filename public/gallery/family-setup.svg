<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgFam)" />
  <g transform="translate(100, 70)">
    <!-- Father -->
    <circle cx="100" cy="100" r="35" fill="#DBEAFE" stroke="#1E40AF" stroke-width="2.5" />
    <path d="M 55 210 C 55 155, 145 155, 145 210 Z" fill="#93C5FD" />

    <!-- Mother -->
    <circle cx="280" cy="105" r="33" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.5" />
    <path d="M 235 210 C 235 160, 325 160, 325 210 Z" fill="#F472B6" />

    <!-- Child in center -->
    <circle cx="190" cy="140" r="26" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
    <path d="M 155 220 C 155 180, 225 180, 225 220 Z" fill="#FBBF24" />
  </g>
  <!-- Decorative photo frame borders -->
  <rect x="40" y="30" width="520" height="340" rx="16" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="10,6" opacity="0.4" />
  <text x="300" y="325" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#991B1B" text-anchor="middle">FAMILY & GROUP PHOTOGRAPHY</text>
  <text x="300" y="350" font-family="system-ui, sans-serif" font-size="12" fill="#7F1D1D" text-anchor="middle">Creating Timeless Memories for Malad Families</text>
</svg>

